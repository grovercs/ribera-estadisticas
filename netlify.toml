# Netlify build configuration for Ribera Estadísticas frontend
# Next.js 16.3 App Router + Supabase SSR

[build]
  # The frontend lives in the `frontend/` subdirectory of this repository.
  base = "frontend"
  command = "npm run build"
  publish = ".next"
  # Functions also import shared code from ../monitoring. Check both paths.
  # Netlify: exit 0 skips the build; nonzero continues (also on missing refs).
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ -z "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../monitoring ../netlify.toml'

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # Pin a stable Node.js LTS version for reproducible builds.
  NODE_VERSION = "22"
  # Disable Next.js telemetry in CI/production builds.
  NEXT_TELEMETRY_DISABLED = "1"

# Security headers for the deployed site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify's Next.js runtime handles SSR/ISR routes automatically.
# Do NOT add a catch-all redirect to /index.html here; it would break SSR.

